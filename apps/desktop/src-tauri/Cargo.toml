[package]
name = "callistseo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application desktop CallistSEO (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url.workspace = true
# Requis par `tauri::generate_context!` dès qu'une section `plugins` existe (config de l'updater).
serde_json.workspace = true
callistseo-api = { path = "../../../crates/api" }
callistseo-storage = { path = "../../../crates/storage" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Activé par `tauri build` : l'interface est embarquée au lieu d'être servie par `devUrl`.
custom-protocol = ["tauri/custom-protocol"]
