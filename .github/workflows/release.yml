name: Release desktop

# Pousser un tag `v0.1.0` (= version de tauri.conf.json) compile l'application sur les trois systèmes
# et crée un brouillon de release GitHub avec les installateurs ; on le relit puis on le publie à la main.
on:
  push:
    tags: ['v*']

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04 # .deb, .rpm, .AppImage
            args: ''
          - platform: windows-latest # .exe (NSIS) et .msi
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Le tag correspond à la version de l'application
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} ≠ version v${version} (tauri.conf.json)"; exit 1; }

      - name: Dépendances système de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # L'interface est construite par `beforeBuildCommand` (tauri.conf.json).
      # ponytail: binaires non signés (avertissement SmartScreen / Gatekeeper) ; ajouter les secrets de signature quand ils existeront.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: CallistSEO ${{ github.ref_name }}
          releaseBody: "Installateurs de l'application desktop CallistSEO (non signés pour l'instant). Docker et ligne de commande : voir le README."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
