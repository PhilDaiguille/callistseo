name: Release desktop

# Pousser un tag `v0.2.0` (= version de tauri.conf.json) compile l'application sur les trois systèmes
# et crée un brouillon de release GitHub avec les installateurs ; on le relit puis on le publie à la main.
# Noms de fichiers sans version (`assets`) : la vitrine pointe vers releases/latest/download/<nom>.
on:
  push:
    tags: ['v*']

jobs:
  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            assets: CallistSEO_macos_arm64[ext]
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
            assets: CallistSEO_macos_intel[ext]
          - platform: ubuntu-22.04 # .deb, .rpm, .AppImage
            args: ''
            assets: CallistSEO_linux[ext]
          - platform: windows-latest # .exe (NSIS) et .msi
            args: ''
            assets: CallistSEO_windows[_setup][ext]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Le tag correspond à la version de l'application
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} ≠ version v${version} (tauri.conf.json)"; exit 1; }

      # Une clé copiée depuis le terminal garde souvent le « % » que zsh affiche en fin de ligne :
      # on le détecte ici, en quelques secondes, plutôt qu'après la compilation.
      - name: Clés de signature des mises à jour lisibles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          check() { printf '%s' "$2" | tr -d '\r\n' | grep -Eq '^[A-Za-z0-9+/]+=*$' || { echo "::error::$1 n'est pas du base64 valide (caractère parasite, souvent un « % » final copié depuis le terminal)"; exit 1; }; }
          check "Le secret TAURI_SIGNING_PRIVATE_KEY" "$TAURI_SIGNING_PRIVATE_KEY"
          check "La clé publique (plugins.updater.pubkey de tauri.conf.json)" "$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")"

      - name: Dépendances système de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # L'interface est construite par `beforeBuildCommand` (tauri.conf.json).
      # Les secrets signent les mises à jour (latest.json, .sig) : clé générée par `pnpm tauri signer generate`.
      # ponytail: binaires non signés (avertissement SmartScreen / Gatekeeper) ; ajouter les secrets de signature OS quand ils existeront.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: CallistSEO ${{ github.ref_name }}
          releaseBody: "Installateurs de l'application desktop CallistSEO (non signés pour l'instant). Docker et ligne de commande : voir le README."
          releaseDraft: true
          # Pas de préversion : GitHub l'exclurait de releases/latest (liens de la vitrine, latest.json
          # de la mise à jour automatique).
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.assets }}
          args: ${{ matrix.args }}
