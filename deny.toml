# cargo deny check : licences compatibles MIT, failles connues (RustSec), sources des crates.
# L'application desktop est incluse (workspace complet).

[advisories]
# Avis « non maintenu » des dépendances indirectes de Tauri / scraper (voir ROADMAP.md, dette) :
# signalés, sans faire échouer la CI. Les failles (vulnerability) échouent toujours.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# Dépendances internes par chemin (crates jamais publiées) : pas de version à fixer.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
