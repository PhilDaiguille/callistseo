[package]
name = "callistseo-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
callistseo-core = { path = "../core" }
callistseo-crawler = { path = "../crawler" }
callistseo-seo-rules = { path = "../seo-rules" }
callistseo-storage = { path = "../storage" }
callistseo-export = { path = "../export" }
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
url.workspace = true
callistseo-audit-diff = { version = "0.1.0", path = "../audit-diff" }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br"] }
aes-gcm = "0.11"
ring = "0.17"
base64 = "0.23"
